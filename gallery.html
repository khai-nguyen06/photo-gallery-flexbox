<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery Flexbox - Thư viện ảnh đáp ứng</title>
    <!-- Liên kết External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="gallery-title">Bộ Sưu Tập Ảnh Du Lịch</h1>

    <!-- 1. CONTAINER CHÍNH BAO BỌC THƯ VIỆN -->
    <div class="gallery-container">
        
        <!-- 8-10 ITEMS ẢNH -->
        <div class="gallery-item">
            <img src="https://picsum.photos/600/400?random=1" alt="Ảnh du lịch 1">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/600/400?random=2" alt="Ảnh du lịch 2">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/600/400?random=3" alt="Ảnh du lịch 3">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/600/400?random=4" alt="Ảnh du lịch 4">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/600/400?random=5" alt="Ảnh du lịch 5">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/600/400?random=6" alt="Ảnh du lịch 6">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/600/400?random=7" alt="Ảnh du lịch 7">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/600/400?random=8" alt="Ảnh du lịch 8">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/600/400?random=9" alt="Ảnh du lịch 9">
        </div>

    </div>

</body>
</html>
